services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: expense
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    depends_on: [postgres]
    environment:
      DB_HOST: postgres
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
    ports: ["3000:3000"]
volumes:
  pgdata:
